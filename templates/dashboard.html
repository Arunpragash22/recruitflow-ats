
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RecruitFlow ATS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-4">
    <span class="navbar-brand">RecruitFlow ATS</span>
</nav>

<div class="container mt-4">

    <h2>Recruitment Dashboard</h2>
    <p class="text-muted">Manage job applications easily.</p>

    <div class="card p-4 mb-4">
        <h4>Add Candidate</h4>

        <form action="/candidates/add" method="post">
            <input class="form-control mb-2"
                   name="name"
                   placeholder="Candidate Name"
                   required>

            <input class="form-control mb-2"
                   name="position"
                   placeholder="Job Position"
                   required>

            <button class="btn btn-primary">
                Add Candidate
            </button>
        </form>
    </div>

    <div class="card p-4">
        <h4>Candidate Applications</h4>

        <form method="get" action="/" class="mb-3">
            <input class="form-control"
                   name="search"
                   placeholder="Search candidates..."
                   value="{{ search }}">
        </form>

        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Position</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>

            <tbody>
                {% for candidate in candidates %}
                <tr>
                    <td>{{ candidate.name }}</td>
                    <td>{{ candidate.position }}</td>
                    <td>{{ candidate.status }}</td>
                    <td>
                        <form action="/candidates/{{ candidate.id }}/status"
                              method="post">
                            <select name="status"
                                    class="form-select"
                                    onchange="this.form.submit()">
                                {% for status in statuses %}
                                <option value="{{ status }}"
                                    {% if candidate.status == status %}
                                    selected
                                    {% endif %}>
                                    {{ status }}
                                </option>
                                {% endfor %}
                            </select>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</div>
</body>
</html>
